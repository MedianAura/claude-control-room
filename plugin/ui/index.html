<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>control-room</title>
<link rel="icon" href="data:,">
<style>
  /* La régie : coulisses noires, panneaux à la lumière de service bleue, feux de cue aux couleurs fixes
     (vert = go / OK, ambre = ta décision, rouge = approbation et panne). Sombre seulement : la page vit sur un
     second écran, dans une pièce sombre. */
  :root {
    color-scheme: dark;
    --bg: #0c0d10; --panel: #131929; --well: #0f1422; --line: #232d47; --line-soft: #1a2236;
    --text: #e9e6df; --muted: #8a90a3;
    --accent: #f2a93b; --ok: #35d07f; --ko: #ff4d42; --info: #6f8cff;
    /* Encres : texte coloré posé sur un panneau (contraste AA sur --panel). */
    --accent-ink: #f2a93b; --ko-ink: #ff7a70;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14.5px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  /* Surfaces du navigateur, thémées depuis la palette au lieu des valeurs par défaut. */
  ::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); color: var(--text); }
  ::placeholder { color: var(--muted); opacity: 1; }
  textarea, input { caret-color: var(--text); }
  :focus-visible { outline: 2px solid var(--text) !important; outline-offset: 2px !important; }
  textarea:focus-visible, input:focus-visible { outline-offset: 0 !important; border-color: var(--muted); }
  code { font: 12.5px Consolas, ui-monospace, monospace; background: var(--well); padding: 1px 5px; border-radius: 3px; }
  .none { color: var(--muted); font-size: 13px; }
  .thin { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

  /* Deux colonnes : à gauche le travail (la décision, puis la discussion), à droite le reste, dans l'ordre
     d'importance (tests, plans, à builder, connectés). */
  main { max-width: 1360px; margin: 0 auto; padding: 24px 40px 60px; display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 24px; align-items: start; }
  section.left { display: grid; gap: 12px; }
  aside { position: sticky; top: 20px; display: grid; gap: 14px; max-height: calc(100vh - 40px); overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  @media (max-width: 1180px) { main { padding: 20px 20px 60px; grid-template-columns: minmax(0, 1fr) 360px; } }
  /* Une colonne : la colonne de droite suit la page, sans défilement imbriqué. */
  /* Connectés : épinglé au bas de la colonne de droite, toujours visible même quand tests et plans la font défiler.
     Une bande de fond au-dessus : ce qui défile disparaît dans l'interligne au lieu d'être coupé contre le cadre.
     Seulement en deux colonnes (sinon, épinglé au bas de l'écran, il passerait devant les tests). */
  @media (min-width: 861px) {
    #sessionsPanel { position: sticky; bottom: 0; }
    #sessionsPanel::before { content: ''; position: absolute; left: -1px; right: -1px; top: -15px; height: 14px; background: var(--bg); }
  }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } aside { position: static; max-height: none; overflow: visible; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
  .panel h2 { margin: 0; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .panel .body { margin-top: 8px; }
  /* Titres repliables (colonne de droite) : un vrai bouton, atteignable au clavier. */
  .panel h2 .cap { all: unset; flex: 1; display: flex; justify-content: space-between; cursor: pointer; user-select: none; }
  /* Chevron dessiné en CSS (deux côtés d'un carré), vers le bas ouvert, vers la droite fermé. */
  .panel h2 .cap::before, .chev::before { content: ''; display: inline-block; width: 5px; height: 5px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-3px) rotate(45deg); }
  .panel h2 .cap::before { margin: 0 10px 0 2px; align-self: center; }
  .panel.closed h2 .cap::before, .chev::before { transform: translateY(-1px) rotate(-45deg); }
  .chev.open::before { transform: translateY(-3px) rotate(45deg); }
  .ic { display: inline-block; vertical-align: -1px; flex: none; }
  .banner .ic { align-self: center; }
  .panel h2 .cap > :first-child { margin-right: auto; }
  .panel.closed .body { display: none; }

  /* Bandeaux : résumé au retour, alertes du serveur, échec d'envoi. */
  .banner { border-radius: 6px; padding: 9px 14px; display: flex; gap: 10px; align-items: baseline; }
  .banner.away { background: color-mix(in srgb, var(--info) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--info) 40%, transparent); }
  .banner.alert { background: color-mix(in srgb, var(--ko) 12%, var(--panel)); border: 1px solid var(--ko); }
  /* Réponse non envoyée : une panne, donc rouge ; bord teinté (pas plein) pour rester sous l'alerte du serveur. */
  .banner.notice { background: color-mix(in srgb, var(--ko) 10%, var(--panel)); border: 1px solid color-mix(in srgb, var(--ko) 45%, transparent); }
  .banner .x { all: unset; cursor: pointer; margin-left: auto; color: var(--muted); }
  #alerts { display: grid; gap: 8px; }
  #alerts:empty, #away:empty { display: none; }
  #view > .banner { margin-bottom: 10px; }

  /* ---------- 1. La décision ---------- */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px 24px; }
  .card.k-approval { border-color: var(--ko); }
  /* Le feu de cue : éteint pendant l'armement (400 / 800 ms, aucune touche ne répond), vert quand les touches
     répondent, rouge quand la carte est suspendue (serveur perdu). */
  /* Tête de carte : le feu à gauche de la première ligne du titre, la session et la nature en dessous (pas de
     sur-titre au-dessus du titre). */
  .head { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 14px; align-items: start; }
  .head .cue { margin-top: 8px; }
  .cue { width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--ok); outline: 1px solid var(--ok); outline-offset: 3px;
    transition: background-color .32s cubic-bezier(.16, 1, .3, 1), outline-color .32s cubic-bezier(.16, 1, .3, 1); }
  @media (prefers-reduced-motion: reduce) { .cue { transition: none; } }
  .card.arming .cue, .card.gone .cue { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); outline-color: var(--line); }
  .card.held .cue { background: var(--ko); outline-color: var(--ko); }
  .meta { font-size: 13px; font-weight: 600; color: var(--accent-ink); margin-top: 3px; }
  .k-approval .meta, .k-error .meta { color: var(--ko-ink); }
  .card.gone .meta { color: var(--muted); }
  .summary { font-size: 22px; font-weight: 600; line-height: 1.3; margin: 0; max-width: 46ch; }
  .card.gone .summary { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .card.gone { border-style: dashed; }
  .label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin: 16px 0 6px; }
  .recap { margin-top: 10px; max-width: 72ch; }
  .recap ul { margin: 4px 0; padding-left: 20px; }
  /* Une commande longue défile dans son cadre (10 lignes) : Autoriser / Refuser restent près d'elle. */
  pre.cmd { white-space: pre-wrap; word-break: break-all; font: 13px/1.45 Consolas, ui-monospace, monospace; background: var(--well); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; margin: 0;
    max-height: calc(10lh + 20px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .opts { display: grid; gap: 6px; margin-top: 16px; }
  button.opt { all: unset; cursor: pointer; display: grid; grid-template-columns: 34px 1fr; align-items: baseline; padding: 9px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--well); }
  button.opt:hover, button.opt:focus-visible { border-color: var(--muted); }
  button.opt.rec { border-color: var(--accent); }
  button.opt.allow { border-color: color-mix(in srgb, var(--ok) 70%, transparent); } button.opt.deny { border-color: color-mix(in srgb, var(--ko) 70%, transparent); }
  .k { font: 600 14px Consolas, ui-monospace, monospace; color: var(--muted); justify-self: start; padding: 0 5px; border-radius: 3px; }
  button.opt.rec .k { color: var(--accent); }
  /* Choix retenu par Maj+chiffre, en attente de la note : la touche s'allume, le cadre passe au texte. */
  button.opt.picked { border-color: var(--text); }
  button.opt.picked .k { background: var(--text); color: var(--bg); }
  .opt b { font-weight: 600; }
  .opt .d { color: var(--muted); font-size: 13.5px; margin-left: 8px; }
  .tag { font-size: 11px; color: var(--accent-ink); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin-left: 8px; }
  /* La proposition : une ligne courante sous un filet, légende ambre à gauche ; pas une boîte dans la carte. */
  .prop { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: baseline; }
  .prop .pcap { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-ink); }
  .actions { display: flex; gap: 10px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
  .btn { all: unset; cursor: pointer; padding: 8px 16px; border-radius: 4px; font-weight: 600; font-size: 14px; }
  .btn.primary { background: var(--ok); color: var(--bg); font-weight: 800; letter-spacing: .06em; }
  .btn.ghost { border: 1px solid var(--line); color: var(--text); padding: 7px 15px; }
  .btn.ghost:hover { border-color: var(--muted); }
  /* « Ensuite » : la file, en une ligne au pied de la carte. */
  .next { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; gap: 12px; align-items: baseline; white-space: nowrap; overflow: hidden; min-width: 0; }
  .next b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .next b.app { color: var(--ko-ink); } .next b.urg { color: var(--accent-ink); }
  /* Armement et serveur perdu : les choix sont visiblement inertes ; perdu, la ligne rouge remplace l'aide. */
  .card.arming .opts, .card.arming .actions > .btn, .card.held .opts, .card.held .actions > .btn { opacity: .45; }
  .held-msg { display: none; color: var(--ko-ink); font-size: 12px; margin-top: 12px; }
  .card.held .held-msg { display: block; } .card.held .hint { display: none; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 12px; }
  .sent { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .sent b { color: var(--text); font-weight: 600; }
  textarea { width: 100%; resize: vertical; background: var(--well); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; font: inherit; }
  #note { margin-top: 12px; min-height: 64px; display: none; } #note.show { display: block; }
  .empty { text-align: center; color: var(--muted); padding: 28px 20px; border: 1px dashed var(--line); border-radius: 6px; }
  .empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 2px; }

  /* ---------- 2. La discussion avec l'orchestratrice ---------- */
  #talk h2 .right { display: flex; gap: 14px; align-items: baseline; }
  #unread { color: var(--accent-ink); text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 600; }
  #unread:empty { display: none; }
  /* Connexion perdue : dite dans l'en-tête de la discussion, sur une ligne (phrase complète en title). */
  #conn { color: var(--ko-ink); text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 32ch; }
  #conn:empty { display: none; }
  .link { all: unset; cursor: pointer; color: var(--muted); }
  .link:hover { color: var(--text); }
  #thread { max-height: 260px; overflow-y: auto; margin-top: 6px; }
  .msg { display: grid; grid-template-columns: 104px minmax(0, 1fr) 46px; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line-soft); font-size: 13.5px; }
  .msg:first-child { border-top: 0; }
  .msg .from { color: var(--muted); } .msg.user .from { color: var(--text); font-weight: 600; }
  .msg .t { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .msg .txt ul { margin: 2px 0; padding-left: 18px; }
  .composer { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; margin-top: 10px; }
  .composer .hint { grid-column: 1 / -1; margin-top: -4px; }
  #msg { min-height: 60px; max-height: 200px; }
  .btn.send { background: var(--text); color: var(--bg); }
  #shot { display: none; font-size: 12px; color: var(--muted); grid-column: 1 / -1; }
  #shot .thumb { position: relative; display: inline-block; margin: 0 8px 6px 0; vertical-align: middle; }
  #shot .thumb img { max-height: 80px; border-radius: 4px; display: block; border: 1px solid var(--line); }
  #shot .thumb .x { all: unset; position: absolute; top: -7px; right: -7px; width: 18px; height: 18px; line-height: 18px; text-align: center;
    font-size: 11px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); color: var(--text); cursor: pointer; }
  #shot .err { color: var(--ko-ink); margin-top: 4px; }
  #histPanel { display: none; } #histPanel.show { display: block; }
  #hist { margin: 0; padding-left: 18px; }
  #hist li { margin: 4px 0; font-size: 13px; color: var(--muted); }

  /* ---------- Colonne de droite ---------- */
  .grp { font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 2px; }
  .grp:first-child { margin-top: 0; }
  .item { padding: 8px 0; border-top: 1px solid var(--line-soft); font-size: 13.5px; }
  .grp + .item, .tgrp + .item { border-top: 0; }
  .tgrp { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  /* 3. Tests : OK, Pas OK, Clarifier (cite le test dans la discussion). */
  .tb { display: flex; gap: 6px; margin-top: 6px; }
  .tb button { all: unset; cursor: pointer; font-size: 12px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 4px; }
  /* Au doigt, les réponses aux tests prennent une vraie cible (40px). */
  @media (pointer: coarse) { .tb button { padding: 10px 14px; min-height: 40px; box-sizing: border-box; display: inline-flex; align-items: center; } }
  .tb .okb { border-color: color-mix(in srgb, var(--ok) 55%, transparent); color: var(--ok); }
  .tb .ko { border-color: color-mix(in srgb, var(--ko) 55%, transparent); color: var(--ko-ink); }
  .tb button:hover { border-color: var(--muted); }
  .tb input { flex: 1; min-width: 0; background: var(--well); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; font: inherit; font-size: 12px; }
  .ref { all: unset; cursor: pointer; font: 12px Consolas, ui-monospace, monospace; color: var(--muted); margin-right: 6px; }
  .ref:hover { color: var(--text); }
  .wt { display: inline-block; width: 1.1em; font-size: 11px; }
  .wt.high { color: var(--text); } .wt.low { color: var(--muted); }
  .more { all: unset; cursor: pointer; display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .more:hover { color: var(--text); }
  .fold { font-size: 12.5px; color: var(--muted); margin: 2px 0 0 1.1em; }
  .fold .nt { margin-top: 3px; } .fold .nt span { font-variant-numeric: tabular-nums; }
  #boardErr:empty { display: none; }
  /* 4. Plans en cours : barre verte, tâche en cours sous le plan replié. */
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin: 6px 0 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .pcur { color: var(--muted); font-size: 12.5px; }
  .phead, .task { all: unset; display: block; width: 100%; box-sizing: border-box; cursor: pointer; user-select: none; }
  .chev { color: var(--muted); display: inline-block; width: 1.1em; }
  .tasks { margin: 4px 0 2px 1.1em; font-size: 12.5px; }
  .task { padding: 2px 0; color: var(--muted); }
  .task.cur { color: var(--text); font-weight: 600; }
  .task.tdone { color: var(--muted); opacity: .75; }
  .steps { margin: 0 0 4px 1.2em; font-size: 12px; color: var(--text); }
  .steps .sdone { color: var(--muted); }
  .pct { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; float: right; }
  /* 6. Connectés : en dernier, une ligne de pastilles. Rond = la session vit sa vie (gris : travaille, anneau :
     inactive, vert : terminé) ; carré + nom coloré = elle attend après toi (ambre : décision, rouge : approbation). */
  #sessions { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 6px; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .chip.st-idle .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
  .chip.st-done .dot { background: var(--ok); }
  .chip.st-decision .dot, .chip.st-approval .dot { width: 9px; height: 9px; border-radius: 2px; }
  .chip.st-decision .dot { background: var(--accent); } .chip.st-decision { color: var(--accent-ink); font-weight: 600; }
  .chip.st-approval .dot { background: var(--ko); } .chip.st-approval { color: var(--ko-ink); font-weight: 600; }
  #scount .mine { color: var(--accent-ink); } #scount .mine.blocked { color: var(--ko-ink); }
  #sessionsPanel.lost .chip { opacity: .45; }
</style>
</head>
<body>
<main>
  <section class="left">
    <!-- Au-dessus de la carte : seulement le résumé au retour, posé quand on n'était pas là. -->
    <div id="away"></div>
    <div id="view" aria-live="polite"><div class="empty"><b>En attente de control-room</b>La page se remplit dès que le serveur répond.</div></div>
    <div id="alerts"></div>
    <div class="panel" id="talk">
      <h2><span>Orchestratrice</span><span class="right"><span id="unread" role="status"></span><span id="conn" role="status"></span><button class="link" id="histBtn" aria-expanded="false">Historique</button></span></h2>
      <div id="thread" class="thin"></div>
      <div class="composer">
        <textarea id="msg" placeholder="Écrire à l'orchestratrice…" aria-describedby="msgHint"></textarea>
        <button class="btn send" id="sendMsg">Envoyer</button>
        <div id="shot"></div>
        <div class="hint" id="msgHint">Ctrl+Entrée envoie · Ctrl+V colle une capture</div>
      </div>
    </div>
    <div class="panel" id="histPanel"><h2><span>Historique des réponses</span></h2><div class="body"><ul id="hist"></ul></div></div>
  </section>
  <aside>
    <div id="boardErr" role="status"></div>
    <div class="panel" data-sec="tests"><h2><button class="cap" aria-expanded="true"><span>À tester par toi</span><span id="tcount"></span></button></h2><div class="body" id="tests"></div></div>
    <div class="panel" data-sec="plans"><h2><button class="cap" aria-expanded="true"><span>Plans en cours</span><span id="pcount"></span></button></h2><div class="body" id="plans"></div></div>
    <div class="panel" data-sec="todos"><h2><button class="cap" aria-expanded="true"><span>À builder ensuite</span><span id="dcount"></span></button></h2><div class="body" id="todos"></div></div>
    <div class="panel" id="sessionsPanel"><h2><span>Connectés</span><span id="scount"></span></h2><div class="body" id="sessions"></div></div>
  </aside>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function md(s) {
  const lines = esc(s).split('\n'); let out = '', inList = false;
  for (let l of lines) {
    l = l.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    const m = l.match(/^\s*[-*•]\s+(.*)/);
    if (m) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${m[1]}</li>`; }
    else { if (inList) { out += '</ul>'; inList = false; } out += l ? `<div>${l}</div>` : '<div style="height:6px"></div>'; }
  }
  return out + (inList ? '</ul>' : '');
}
// Icônes dessinées (16×16, trait 1,5, couleur du texte) : aucune icône n'est un glyphe Unicode.
const ICON = {
  x: '<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>',
  check: '<path d="M3.5 8.5l3 3 6-7"/>',
  warn: '<path d="M8 2.75l5.75 10.5H2.25z"/><path d="M8 6.75v3M8 11.75v.01"/>',
  dot: '<circle cx="8" cy="8" r="3" fill="currentColor" stroke="none"/>',
  ring: '<circle cx="8" cy="8" r="3"/>',
  up: '<path d="M8 4.5l4 7H4z" fill="currentColor"/>',
  down: '<path d="M8 11.5l-4-7h8z"/>',
};
const icon = (n) => `<svg class="ic" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const hhmm = (t) => new Date(t).toLocaleTimeString('fr-CA', { hour: '2-digit', minute: '2-digit' });
// Erreur réseau (serveur arrêté, connexion coupée) : status 0, jamais d'exception silencieuse.
async function post(url, body) {
  let r;
  try { r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }); }
  catch { return { status: 0 }; }
  let json; try { json = await r.json(); } catch {}
  return { status: r.status, json };
}

let state = { pending: [], recent: [], sessions: [], right: { board: { error: null }, tests: [], plans: [], todos: [] }, events: [], alerts: [] };
let currentId = null, noteOpen = false, pendingChoice = null, lastSent = null;
// Cartes répondues depuis cette page : masquées dès le clic, même si un /api/state parti avant la réponse
// les liste encore. Retirées du Set seulement si l'envoi échoue (la carte revient).
const answered = new Set();
let notice = '';

// ---------- la carte : jamais remplacée tant qu'elle n'a pas de réponse ----------
function optionsOf(c) {
  if (c.kind === 'approval') return [{ id: 'allow', label: 'Autoriser', cls: 'allow' }, { id: 'deny', label: 'Refuser', cls: 'deny' }];
  if (c.kind === 'reply' || c.kind === 'error') return [];
  return c.options || [];
}

// Pourquoi la carte lue a disparu sans réponse d'ici. Seule cette page répond : une approbation non annulée
// qui quitte la file a expiré (le hook ne tire plus, ou son délai est passé) et se règle dans le terminal.
function goneWhy(c) {
  const k = (state.cancelled || []).find(x => x.id === c.id);
  if (k) return `Annulée par l'orchestratrice${k.reason ? ` : ${esc(k.reason)}` : '.'}`;
  if (c.kind === 'approval') return 'Approbation expirée : la demande se règle maintenant dans le terminal.';
  return 'Cette carte n\'est plus en attente (réponse donnée depuis un autre onglet ?).';
}

// En tête de #view, rendus avec la carte : l'échec d'envoi, puis la trace de la dernière réponse. Jamais ajoutés
// au-dessus d'une carte déjà affichée.
function viewHead() {
  const n = notice ? `<div class="banner notice" role="alert">${notice}<button class="x" title="Fermer" aria-label="Fermer">${icon('x')}</button></div>` : '';
  const sent = lastSent ? `<div class="sent">${icon('check')} Envoyé à ${esc(lastSent.agent)} : <b>${esc(lastSent.label)}</b> · ${hhmm(lastSent.at)}</div>` : '';
  return n + sent;
}
function wireHead() {
  const x = $('#view > .banner .x'); if (x) x.onclick = () => { notice = ''; x.closest('.banner').remove(); };
}

let shown = null, tomb = null; // carte affichée ; pierre tombale tant qu'on n'a pas fait « Continuer »
function renderCard() {
  if (tomb) return; // la pierre tombale reste jusqu'à « Continuer »
  const c = currentId && state.pending.find(x => x.id === currentId);
  if (c) return; // la carte affichée reste telle quelle
  noteOpen = false; pendingChoice = null;
  if (currentId && shown && shown.id === currentId) {
    // Disparue sans réponse d'ici : elle reste à sa place, barrée, avec la raison. Aucune touche ne peut tomber
    // sur la carte suivante tant qu'on n'a pas continué. Un échec d'envoi sur cette carte ne veut plus rien dire.
    tomb = shown; notice = '';
    $('#view').innerHTML = `${viewHead()}
      <div class="card gone k-${esc(tomb.kind)}">
        <div class="head"><span class="cue" aria-hidden="true"></span><div><div class="summary">${esc(tomb.summary)}</div><div class="meta">${esc(tomb.agent)}</div></div></div>
        <div class="recap">${goneWhy(tomb)}</div>
        <div class="actions"><button class="btn primary" id="goOn">Continuer ↵</button><span class="next" id="next"></span></div>
      </div>`;
    wireHead();
    $('#goOn').onclick = leaveTomb;
    return;
  }
  const next = state.pending[0];
  if (!next) {
    currentId = null; shown = null;
    $('#view').innerHTML = `${viewHead()}<div class="empty"><b>Rien à trancher</b>Les prochaines cartes de l'orchestratrice apparaîtront ici.</div>`;
    wireHead();
    return;
  }
  currentId = next.id; shown = next;
  shownAt = Date.now();
  const armMs = next.kind === 'approval' ? APPROVAL_ARM_MS : CARD_ARM_MS;
  const opts = optionsOf(next);
  const optHtml = opts.map((o, i) => `
    <button class="opt ${next.recommended === o.id ? 'rec' : ''} ${o.cls || ''}" data-choice="${esc(o.id)}">
      <span class="k">${i + 1}</span>
      <span><b>${esc(o.label)}</b>${next.recommended === o.id ? '<span class="tag">recommandé</span>' : ''}${o.detail ? `<span class="d">${esc(o.detail)}</span>` : ''}</span>
    </button>`).join('');
  // Légende du feu : qui demande, et de quelle nature (la couleur suit : ambre ta décision, rouge approbation / erreur).
  const kindWord = next.kind === 'approval' ? 'approbation' : next.kind === 'error' ? 'erreur' : next.urgent ? 'urgent' : 'ta décision';
  const cmd = next.tool && next.tool.input && next.tool.input.command;
  const toolName = next.tool && next.tool.name ? ` ${esc(next.tool.name)}` : '';
  const tool = next.tool ? `<div class="label">${cmd ? 'Commande' : 'Outil'}${toolName}</div><pre class="cmd" tabindex="0">${esc(cmd || JSON.stringify(next.tool.input, null, 2))}</pre>` : '';
  const readOnly = next.kind === 'reply' || next.kind === 'error';
  // Une note seule sur une approbation est un refus (hooks.js) ; sans option ni proposition, « Autre » n'a pas
  // de quoi être autre.
  const noteLabel = next.kind === 'approval' ? 'Refuser avec une note' : readOnly || !(opts.length || next.proposition) ? 'Répondre' : 'Autre / nuancer';
  // Chiffres, ↵ et (N) sont imprimés sur les contrôles ; l'aide ne dit que ce qui ne se voit pas.
  const hint = next.kind !== 'approval' && opts.length ? '<div class="hint">Maj+chiffre : choisir avec une note</div>' : '';
  $('#view').innerHTML = `${viewHead()}
    <div class="card k-${esc(next.kind)} arming">
      <div class="head"><span class="cue" aria-hidden="true"></span><div><div class="summary">${esc(next.summary)}</div><div class="meta">${esc(next.agent)} · ${kindWord}</div></div></div>
      ${tool}
      ${next.recap ? `<div class="recap">${md(next.recap)}</div>` : ''}
      ${opts.length ? `<div class="opts">${optHtml}</div>` : ''}
      ${next.proposition ? `<div class="prop"><span class="pcap">Proposition</span>${md(next.proposition)}</div>` : ''}
      <div class="actions">
        ${readOnly ? `<button class="btn primary" data-choice="read">Lu ↵</button>` : ''}
        ${next.proposition ? `<button class="btn primary" data-choice="proposition" aria-label="Go avec la proposition">GO ↵</button>` : ''}
        <button class="btn ghost" id="noteBtn">${noteLabel} (N)</button>
        <span class="next" id="next"></span>
      </div>
      <textarea id="note" placeholder="${notePh(next)}"></textarea>
      <div class="held-msg">Réponses suspendues : control-room ne répond plus. La carte attend le retour du serveur.</div>
      ${hint}
    </div>`;
  wireHead();
  $('#view').querySelectorAll('[data-choice]').forEach(b => b.onclick = () => answer(b.dataset.choice));
  $('#noteBtn').onclick = toggleNote;
  const card = $('#view .card'), id = next.id;
  card.classList.toggle('held', lostSince !== null);
  setTimeout(() => { if (currentId === id) card.classList.remove('arming'); }, armMs);
}

function leaveTomb() { tomb = null; currentId = null; renderCard(); renderQueue(); }

// Libellé lisible d'une réponse, pour la trace « Envoyé ». Sur une approbation, la trace dit ce que le hook fera :
// une note seule refuse, et Autoriser ne transmet pas la note (hooks.js).
function choiceLabel(c, choice, note) {
  if (c && c.kind === 'approval') {
    if (choice === 'allow') return note ? 'Autoriser, sans la note' : 'Autoriser';
    return note ? 'Refuser + note' : 'Refuser';
  }
  const o = c && optionsOf(c).find(x => x.id === choice);
  const base = o ? o.label : choice === 'proposition' ? 'la proposition' : choice === 'read' ? 'Lu' : choice === 'note' ? 'ta réponse' : choice;
  return note && choice !== 'note' ? `${base} + note` : base;
}

// « Ensuite » : ce qui vient après la carte affichée, dans l'ordre de passage, en une ligne au pied de la carte
// (nom de la session, le résumé en title). Mis à jour sur place, aligné à droite : rien d'autre ne bouge.
const QUEUE_NAMES = 4;
function renderQueue() {
  renderStatus();
  const el = $('#next'); if (!el) return;
  const others = state.pending.filter(c => c.id !== currentId);
  const name = c => `<b class="${c.kind === 'approval' ? 'app' : c.urgent ? 'urg' : ''}" title="${esc(c.agent)} — ${esc(c.summary)}">${esc(c.agent)}${c.kind === 'approval' ? ' · approbation' : ''}</b>`;
  el.innerHTML = !others.length ? '' : 'Ensuite' + others.slice(0, QUEUE_NAMES).map(name).join('') +
    (others.length > QUEUE_NAMES ? `<span>+${others.length - QUEUE_NAMES}</span>` : '');
}

// Note : fermer la note abandonne aussi le choix retenu par Maj+chiffre (sinon Échap puis N puis Ctrl+Entrée
// enverrait un choix que plus rien n'affiche).
function notePh(c, o) {
  if (c.kind === 'approval') return 'Pourquoi tu refuses… (Ctrl+Entrée pour refuser)';
  if (o) return `Note jointe à « ${o.label} »… (Ctrl+Entrée pour envoyer, Échap pour annuler le choix)`;
  const free = c.kind === 'reply' || c.kind === 'error' || !((c.options || []).length || c.proposition);
  return `${free ? 'Ta réponse' : 'Ta réponse ou ta nuance'}… (Ctrl+Entrée pour envoyer)`;
}
function toggleNote() {
  noteOpen = !noteOpen; const t = $('#note'); t.classList.toggle('show', noteOpen);
  if (noteOpen) t.focus(); else pick(null);
}
function pick(ch) {
  pendingChoice = ch;
  const c = shown, o = ch && c && optionsOf(c).find(x => x.id === ch);
  $('#view').querySelectorAll('button.opt').forEach(b => {
    const on = b.dataset.choice === ch;
    b.classList.toggle('picked', on);
    if (on) b.setAttribute('aria-pressed', 'true'); else b.removeAttribute('aria-pressed');
  });
  const t = $('#note');
  if (t && c) t.placeholder = notePh(c, o);
}

async function answer(choice) {
  if (!currentId || tomb) return;
  // Serveur perdu : la carte est suspendue (ligne rouge), rien ne part.
  if (lostSince !== null) return;
  const c = state.pending.find(x => x.id === currentId);
  // Armement : un double clic ou une touche répétée ne doit pas répondre à la carte qui vient d'apparaître.
  if (Date.now() - shownAt < (c && c.kind === 'approval' ? APPROVAL_ARM_MS : CARD_ARM_MS)) return;
  const t = $('#note'); const note = t && t.value.trim();
  if (choice === 'note' && !note) return;
  const id = currentId;
  answered.add(id); notice = '';
  lastSent = { agent: c ? c.agent : '', label: choiceLabel(c, choice, note), at: Date.now() };
  state.pending = state.pending.filter(x => x.id !== id);
  currentId = null; renderCard(); renderQueue();
  const r = await post('/api/answer', { id, choice, note });
  if (r.status !== 200 && r.status !== 409 && r.status !== 404) {
    answered.delete(id); lastSent = null;
    notice = `Réponse à « ${esc(c ? c.summary : id)} » non envoyée (${r.status ? `erreur ${r.status}` : 'serveur injoignable'}) : la carte est de nouveau à toi.`;
    // La carte qui a échoué redevient la carte affichée, en tête de file : renderCard a déjà promu la suivante,
    // il faut la lâcher (currentId = null) sans quoi elle resterait affichée sous une trace « Envoyé » fausse.
    // Remise locale : si le serveur est tombé, load() échoue aussi et ne la ramènerait pas.
    if (c) state.pending = [c, ...state.pending.filter(x => x.id !== id)];
    tomb = null; currentId = null; renderCard(); renderQueue();
  }
  load();
}

// Une approbation n'accepte de raccourci qu'après ce délai : une touche répétée ou un double appui sur la carte
// précédente ne doit jamais tomber sur « Autoriser » (revue #10).
const APPROVAL_ARM_MS = 800, CARD_ARM_MS = 400;
let shownAt = 0;

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const a = document.activeElement;
  if (a && (a.id === 'msg' || (a.closest && a.closest('aside')))) return;
  // Entrée / Espace sur un bouton focalisé : c'est ce bouton qui répond (activation native), pas la proposition.
  const onButton = (e.key === 'Enter' || e.key === ' ') && e.target.closest?.('button');
  if (tomb) { if (e.key === 'Enter' && !onButton && !e.altKey && !e.ctrlKey && !e.metaKey) { e.preventDefault(); leaveTomb(); } return; }
  const c = currentId && state.pending.find(x => x.id === currentId); if (!c) return;
  if (c.kind === 'approval' && Date.now() - shownAt < APPROVAL_ARM_MS && !e.target.closest?.('#note')) return;
  if (a && a.id === 'note') {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); answer(pendingChoice || 'note'); }
    if (e.key === 'Escape') toggleNote();
    return;
  }
  if (onButton) return;
  // Alt / Ctrl / Méta + chiffre appartiennent au navigateur ou à l'OS (onglets, AltGr) : jamais une réponse.
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const opts = optionsOf(c);
  const m = /^(?:Digit|Numpad)([1-9])$/.exec(e.code || '');
  const digit = m ? +m[1] : NaN;
  if (digit >= 1 && digit <= opts.length) {
    const ch = opts[digit - 1].id;
    if (!e.shiftKey) answer(ch);
    else {
      // preventDefault : sinon le caractère (« ! ») tombe dans la note qui prend le focus pendant la frappe.
      e.preventDefault();
      // Autoriser + note n'existe pas : le hook ne transmet une note qu'avec un refus (hooks.js).
      if (c.kind === 'approval' && ch === 'allow') return;
      pick(ch); if (!noteOpen) toggleNote();
    }
  } else if (e.key === 'Enter' && (c.kind === 'reply' || c.kind === 'error')) answer('read');
  else if (e.key === 'Enter' && c.proposition) answer('proposition');
  else if (e.key.toLowerCase() === 'n') { e.preventDefault(); toggleNote(); }
});

// ---------- bandeau des sessions ----------
const STATE_LABEL = { working: 'travaille', decision: 'attend ta décision', approval: 'attend ton approbation', idle: 'inactive', done: 'terminé' };
const WAITS = new Set(['decision', 'approval']);
function renderSessions() {
  const s = state.sessions || [];
  const mine = s.filter(x => WAITS.has(x.status)), blocked = mine.some(x => x.status === 'approval');
  $('#scount').innerHTML = !s.length ? '' : mine.length ? `<span class="mine ${blocked ? 'blocked' : ''}">${mine.length} à toi</span> · ${s.length}` : String(s.length);
  // En dernier dans la colonne : une pastille par session, le détail (état, activité, heure) en title. Ce qui attend
  // après toi garde sa forme carrée et son nom coloré ; le mot d'état est dans le title et dans l'aria-label.
  const tip = (x) => [STATE_LABEL[x.status], x.activity && x.activity !== STATE_LABEL[x.status] ? x.activity : '', x.at ? hhmm(x.at) : ''].filter(Boolean).join(' · ');
  $('#sessions').innerHTML = s.length ? s.map(x =>
    `<span class="chip st-${esc(x.status)}" title="${esc(tip(x))}" aria-label="${esc(x.label)} : ${esc(tip(x))}"><span class="dot"></span>${esc(x.label)}</span>`).join('')
    : '<div class="none">Aucune session inscrite (control-room label).</div>';
  setFavicon(blocked ? 'approval' : mine.length ? 'decision' : '');
}

// Favicon : un carré rouge (approbation) ou ambre (décision) quand quelque chose attend, pour le voir depuis un
// autre onglet ; rien sinon.
let favKind = null;
function setFavicon(kind) {
  if (kind === favKind) return;
  favKind = kind;
  const color = kind && getComputedStyle(document.documentElement).getPropertyValue(kind === 'approval' ? '--ko' : '--accent').trim();
  $('link[rel=icon]').href = !kind ? 'data:,'
    : 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2.5" fill="${color}"/></svg>`);
}

function renderAlerts() {
  $('#alerts').innerHTML = (state.alerts || []).map(a => `<div class="banner alert">${icon('warn')}<span>${esc(a)}</span></div>`).join('');
  renderStatus();
}

// En-tête du bandeau : la ligne fixe où se signale ce qui cloche (connexion d'abord, puis alertes), et le ⚠ du
// titre de l'onglet. Écrire ici ne décale jamais la carte.
function renderStatus() {
  const lost = lostSince !== null, nAlerts = lost ? 0 : (state.alerts || []).length;
  $('#sessionsPanel').classList.toggle('lost', lost);
  const card = $('#view .card:not(.gone)'); if (card) card.classList.toggle('held', lost);
  // En-tête de la discussion : le texte court tient sur une ligne, la phrase complète est dans le title (et
  // l'ellipse coupe au pire, l'en-tête ne grandit jamais).
  const unauth = lostStatus === 401 || lostStatus === 403;
  const [short, full] = !lost ? (nAlerts ? [`${nAlerts > 1 ? `${nAlerts} alertes` : 'alerte'} · détail sous la carte`, ''] : ['', ''])
    : unauth ? ['onglet plus autorisé', 'Onglet plus autorisé : utilise celui ouvert par control-room start.']
    : [`hors ligne depuis ${hhmm(lostSince)}`, `control-room ne répond plus depuis ${hhmm(lostSince)}.`];
  $('#conn').textContent = short;
  $('#conn').title = full;
  const n = state.pending.length;
  document.title = (lost || nAlerts ? '⚠ ' : '') + (n ? `(${n}) control-room` : 'control-room');
}

// ---------- résumé au retour ----------
let leftAt = null;
const AWAY_MS = 120000;
function markLeft() { if (leftAt === null) leftAt = Date.now(); }
function markBack() {
  if (leftAt === null) return;
  const away = Date.now() - leftAt; const since = leftAt; leftAt = null;
  if (away < AWAY_MS) return;
  load().then(() => {
    const ev = (state.events || []).filter(e => e.at > since);
    if (!ev.length) return;
    const mins = Math.round(away / 60000);
    const text = ev.map(e => esc(e.text)).join(' · ');
    $('#away').innerHTML = `<div class="banner away"><b>Pendant ton absence (${mins} min) :</b> <span>${text}</span><button class="x" title="Fermer" aria-label="Fermer le résumé">${icon('x')}</button></div>`;
    $('#away .x').onclick = () => { $('#away').innerHTML = ''; };
  });
}
document.addEventListener('visibilitychange', () => document.hidden ? markLeft() : markBack());
window.addEventListener('blur', markLeft);
window.addEventListener('focus', markBack);

// ---------- discussion avec l'orchestratrice ----------
// Ses réponses (outil reply) et tes messages, du plus ancien au plus récent. Gelée sous la souris : un message qui
// arrive pendant que tu lis le fil attend que tu en sortes. Non lus : ses messages plus récents que le dernier
// moment où tu as regardé le fil (survol, ou focus dans la zone de saisie).
let lastTalk = null, talkHover = false;
let seenAt = +(localStorage.getItem('cr-seen') || 0);
const lastFromHer = () => (state.conversation || []).filter(m => m.by === 'orchestrator').at(-1);
function markSeen() {
  const m = lastFromHer(); if (!m || m.at <= seenAt) return;
  seenAt = m.at; localStorage.setItem('cr-seen', String(seenAt)); renderUnread();
}
function renderUnread() {
  const n = (state.conversation || []).filter(m => m.by === 'orchestrator' && m.at > seenAt).length;
  $('#unread').innerHTML = n ? `${icon('dot')}${n > 1 ? `${n} non lus` : 'non lu'}` : '';
}
function renderTalk() {
  const conv = state.conversation || [];
  // Premier chargement de cette page : l'existant est déjà vu, seuls les messages qui arrivent ensuite comptent.
  if (!localStorage.getItem('cr-seen')) { seenAt = lastFromHer()?.at || Date.now(); localStorage.setItem('cr-seen', String(seenAt)); }
  renderUnread();
  const key = conv.length ? conv.at(-1).id : '';
  if (key === lastTalk || talkHover) return;
  lastTalk = key;
  const who = (m) => m.by === 'user' ? 'toi' : esc(m.agent || 'orchestratrice');
  const caps = (m) => m.captures ? ` <span class="none">· ${m.captures} capture${m.captures > 1 ? 's' : ''}</span>` : '';
  const el = $('#thread');
  el.innerHTML = conv.length ? conv.map(m => `<div class="msg ${m.by === 'user' ? 'user' : 'her'}"><span class="from">${who(m)}</span><div class="txt">${md(m.text)}${caps(m)}</div><span class="t">${hhmm(m.at)}</span></div>`).join('')
    : '<div class="none">Pas encore d\'échange : écris-lui ci-dessous, ses réponses arrivent ici.</div>';
  el.scrollTop = el.scrollHeight;
}
$('#thread').addEventListener('mouseenter', () => { talkHover = true; markSeen(); });
$('#thread').addEventListener('mouseleave', () => { talkHover = false; renderTalk(); });
$('#msg').addEventListener('focus', markSeen);

// ---------- historique des réponses ----------
$('#histBtn').onclick = () => {
  const open = $('#histPanel').classList.toggle('show');
  $('#histBtn').setAttribute('aria-expanded', String(open));
  // Le panneau s'ouvre sous la discussion, souvent hors écran : l'amener dans la vue.
  if (open) $('#histPanel').scrollIntoView({ block: 'nearest' });
};
function renderHistory() {
  $('#hist').innerHTML = (state.recent || []).map(r => `<li>${r.at ? hhmm(r.at) + ' · ' : ''}${esc(r.text)}</li>`).join('') || '<li>Rien encore.</li>';
}

// ---------- message libre à l'orchestratrice (+ captures collées, 5 au plus) ----------
const MAX_SHOTS = 5, MAX_SHOT_BYTES = 10 * 1024 * 1024;
let shots = [], shotMsg = '';
function renderShots() {
  const el = $('#shot');
  el.style.display = shots.length || shotMsg ? 'block' : 'none';
  el.innerHTML = shots.map((s, i) => !s ? '' : `<span class="thumb"><img src="${s}" alt=""><button class="x" data-i="${i}" title="Retirer" aria-label="Retirer la capture ${i + 1}">${icon('x')}</button></span>`).join('')
    + (shots.length ? `<span>${shots.length} capture${shots.length > 1 ? 's' : ''} jointe${shots.length > 1 ? 's' : ''}</span>` : '')
    + (shotMsg ? `<div class="err">${esc(shotMsg)}</div>` : '');
  el.querySelectorAll('.x').forEach(b => b.onclick = () => { shots.splice(+b.dataset.i, 1); shotMsg = ''; renderShots(); });
}
$('#msg').addEventListener('paste', (e) => {
  const files = [...(e.clipboardData?.items || [])].filter(i => i.type.startsWith('image/')).map(i => i.getAsFile());
  if (!files.length) return;
  e.preventDefault();
  for (const file of files) {
    if (shots.length >= MAX_SHOTS) { shotMsg = `${MAX_SHOTS} captures au plus par message.`; break; }
    if (file.size > MAX_SHOT_BYTES) { shotMsg = 'Capture trop lourde (10 Mo max).'; continue; }
    const slot = shots.push(null) - 1; // garde l'ordre de collage malgré la lecture asynchrone
    const reader = new FileReader();
    reader.onload = () => { shots[slot] = reader.result; renderShots(); };
    reader.readAsDataURL(file);
  }
  renderShots();
});
function clearShots() { shots = []; shotMsg = ''; renderShots(); }
async function sendMessage() {
  const text = $('#msg').value.trim();
  const images = shots.filter(Boolean);
  if (!text && !images.length) return;
  const r = await post('/api/message', { text, images });
  if (r.status === 200) { $('#msg').value = ''; clearShots(); load(); return; }
  // Échec : texte et captures restent là pour réessayer.
  shotMsg = r.status === 413 ? ((r.json && r.json.error) || 'Trop lourd.') : r.status === 415 ? 'Ce n\'est pas une image PNG, JPEG ou WebP.'
    : r.status === 0 ? 'control-room ne répond plus (serveur arrêté ?).' : `Envoi impossible (${r.status}).`;
  renderShots();
}
$('#sendMsg').onclick = sendMessage;
$('#msg').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendMessage(); } });

// ---------- colonne de droite ----------
const closed = new Set(JSON.parse(localStorage.getItem('cr-closed') || '[]'));
document.querySelectorAll('aside .panel[data-sec]').forEach(p => {
  const cap = p.querySelector('.cap');
  const sync = () => cap.setAttribute('aria-expanded', String(!p.classList.contains('closed')));
  if (closed.has(p.dataset.sec)) p.classList.add('closed');
  sync();
  cap.onclick = () => { p.classList.toggle('closed'); sync(); closed[p.classList.contains('closed') ? 'add' : 'delete'](p.dataset.sec); localStorage.setItem('cr-closed', JSON.stringify([...closed])); };
});
let lastSide = '', hovering = false;
// Tests passés OK depuis cette page (id → 'sending' puis 'sent') : masqués dès le clic, même sous la souris et même si
// un /api/state parti avant la réponse les liste encore (comme `answered` pour les cartes). Oubliés quand l'état ne
// les liste plus (un test rouvert doit revenir), ou aussitôt si l'envoi échoue (le test revient).
const submitted = new Map();
$('aside').addEventListener('mouseenter', () => { hovering = true; });
$('aside').addEventListener('mouseleave', () => { hovering = false; });

// Plans dépliables : un clic sur le plan montre ses tâches ; la tâche en cours (première non finie) montre ses
// étapes d'office, un clic sur une tâche inverse ce choix.
const openPlans = new Set(JSON.parse(localStorage.getItem('cr-open-plans') || '[]'));
const saveOpenPlans = () => localStorage.setItem('cr-open-plans', JSON.stringify([...openPlans]));
const flippedTasks = new Set();
const inline = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
const flip = (set, k) => set.has(k) ? set.delete(k) : set.add(k);
const chev = (open) => `<span class="chev ${open ? 'open' : ''}" aria-hidden="true"></span>`;
function planHtml(p) {
  const pct = p.total ? Math.round(100 * p.done / p.total) : 0;
  const open = openPlans.has(p.name);
  const head = `<button class="phead" data-plan="${esc(p.name)}" data-fk="plan:${esc(p.name)}" aria-expanded="${open}"><span class="pct">${p.done}/${p.total}</span>${chev(open)}${esc(p.label || p.name)}</button><div class="bar"><i style="width:${pct}%"></i></div>`;
  const tasks = p.tasks || [];
  const cur = tasks.findIndex(t => t.done < t.total);
  // Replié, le plan dit quand même où il en est : sa tâche en cours.
  if (!open) return `<div class="item">${head}${cur >= 0 ? `<div class="pcur">${icon('dot')} ${inline(tasks[cur].title)} — ${tasks[cur].done}/${tasks[cur].total}</div>` : ''}</div>`;
  const body = tasks.length ? tasks.map((t, i) => {
    const k = `${p.name}::${t.title}`;
    const shown = (i === cur) !== flippedTasks.has(k);
    const done = t.total && t.done === t.total;
    const mark = icon(done ? 'check' : i === cur ? 'dot' : 'ring');
    const steps = shown && t.steps.length ? `<div class="steps">${t.steps.map(s => `<div class="${s.done ? 'sdone' : ''}">${icon(s.done ? 'check' : 'ring')} ${inline(s.text)}</div>`).join('')}</div>` : '';
    return `<button class="task ${i === cur ? 'cur' : ''} ${done ? 'tdone' : ''}" data-task="${esc(k)}" data-fk="task:${esc(k)}" aria-expanded="${!!shown}"><span class="pct">${t.done}/${t.total}</span>${mark} ${inline(t.title)}</button>${steps}`;
  }).join('') : '<div class="none">Pas de tâches « ### » dans ce plan.</div>';
  return `<div class="item">${head}<div class="tasks">${body}</div></div>`;
}

// Élément du tableau (test ou TODO) : #id qui se cite, poids, texte ; détail et notes repliés.
const WEIGHT_MARK = { high: [icon('up'), 'haut'], low: [icon('down'), 'bas'] };
const BY = { user: 'toi', orchestrator: 'orchestratrice' };
const openItems = new Set();
const stamp = (t) => new Date(t).toLocaleString('fr-CA', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
function boardItem(t, isTest) {
  const w = WEIGHT_MARK[t.weight];
  const mark = w ? `<span class="wt ${t.weight}" title="Poids ${w[1]}" aria-label="poids ${w[1]}">${w[0]}</span>` : '';
  const notes = t.notes || [];
  const what = [t.detail ? 'détail' : '', notes.length ? `${notes.length} note${notes.length > 1 ? 's' : ''}` : ''].filter(Boolean).join(' · ');
  const open = openItems.has(t.id);
  const more = what ? `<button class="more" data-more="${esc(t.id)}" data-fk="fold:${esc(t.id)}" aria-expanded="${open}">${chev(open)}${what}</button>` : '';
  const fold = open && what ? `<div class="fold">${t.detail ? md(t.detail) : ''}${notes.map(n => `<div class="nt"><span>${stamp(n.at)}</span> · ${esc(BY[n.by] || n.by)} : ${inline(n.text)}</div>`).join('')}</div>` : '';
  const plan = !isTest && t.plan ? ` <span class="none">· ${esc(t.plan)}</span>` : '';
  const tb = isTest ? `<div class="tb"><button class="okb" data-fk="ok:${esc(t.id)}">OK</button><button class="ko" data-fk="ko:${esc(t.id)}">Pas OK</button><button class="clar" data-fk="clar:${esc(t.id)}" title="Citer #${esc(t.id)} dans la discussion avec l'orchestratrice">Clarifier</button></div>` : '';
  return `<div class="item" data-id="${esc(t.id)}"><div><button class="ref" data-ref="${esc(t.id)}" data-fk="ref:${esc(t.id)}" title="Citer #${esc(t.id)} dans le message">#${esc(t.id)}</button>${mark}${inline(t.text)}${plan}</div>${more}${fold}${tb}</div>`;
}

// Un clic sur #id le cite dans la zone de message, à l'endroit du curseur.
function cite(id) {
  const m = $('#msg');
  const start = m.selectionStart ?? m.value.length, end = m.selectionEnd ?? start;
  const before = m.value.slice(0, start);
  m.setRangeText(`${before && !/\s$/.test(before) ? ' ' : ''}#${id} `, start, end, 'end');
  m.focus();
}

function renderSide(force) {
  const r0 = state.right || { board: { error: null }, tests: [], plans: [], todos: [] };
  const listed = new Set(r0.tests.flatMap(g => g.tasks.flatMap(k => k.items.map(t => t.id))));
  for (const [id, s] of submitted) if (s === 'sent' && !listed.has(id)) submitted.delete(id);
  const r = { ...r0, tests: r0.tests
    .map(g => ({ ...g, tasks: g.tasks.map(k => ({ ...k, items: k.items.filter(t => !submitted.has(t.id)) })).filter(k => k.items.length) }))
    .filter(g => g.tasks.length) };
  const key = JSON.stringify(r);
  // Gelée sous la souris et pendant une saisie (note KO). Un bouton focalisé ne gèle pas la colonne : il est
  // retrouvé par sa clé data-fk après le rendu, pour qu'on puisse la parcourir au clavier.
  const f = document.activeElement;
  if (!force && (key === lastSide || hovering || f?.matches?.('aside input'))) return;
  const fk = f?.closest?.('aside') && f.dataset.fk;
  lastSide = key;
  const unreadable = r.board && r.board.error;
  $('#boardErr').innerHTML = unreadable ? `<div class="banner alert">${icon('warn')}<span>Tableau illisible : ${esc(r.board.error)}</span></div>` : '';
  const nTests = r.tests.reduce((n, g) => n + g.tasks.reduce((m, k) => m + k.items.length, 0), 0);
  $('#tcount').textContent = nTests || '';
  $('#tests').innerHTML = nTests ? r.tests.map(g => `<div class="grp">${esc(g.label)}</div>` + g.tasks.map(k =>
    (k.task === null ? '' : `<div class="tgrp">${inline(k.task)}</div>`) + k.items.map(t => boardItem(t, true)).join('')).join('')).join('')
    : `<div class="none">${unreadable ? 'Tableau illisible.' : 'Rien à tester.'}</div>`;
  $('#tests').querySelectorAll('.item').forEach(el => {
    const id = el.dataset.id;
    // Rendus forcés : sous la souris la colonne est gelée, et le test cliqué ne doit pas rester à portée d'un second clic.
    el.querySelector('.okb').onclick = async () => {
      submitted.set(id, 'sending'); renderSide(true);
      const res = await post('/api/test', { id, result: 'ok' });
      if (res.status === 200) submitted.set(id, 'sent'); else submitted.delete(id);
      await load(); renderSide(true);
    };
    // Clarifier : le test est cité dans la discussion, le curseur y attend la question.
    el.querySelector('.clar').onclick = () => cite(id);
    el.querySelector('.ko').onclick = () => {
      const tb = el.querySelector('.tb');
      tb.innerHTML = `<input placeholder="Qu'est-ce qui ne marche pas ? (Entrée)"><button class="ko">Envoyer</button>`;
      const input = tb.querySelector('input'), send = tb.querySelector('button'); input.focus();
      // Saisie bloquée pendant l'envoi : un double Entrée ne doit pas ajouter deux notes ni livrer deux KO.
      const go = async () => {
        const note = input.value.trim();
        if (!note || input.disabled) return;
        input.disabled = send.disabled = true;
        const res = await post('/api/test', { id, result: 'fail', note });
        if (res.status !== 200) { input.disabled = send.disabled = false; input.focus(); return; }
        input.blur(); await load(); renderSide(true);
      };
      input.onkeydown = (e) => { if (e.key === 'Enter') go(); if (e.key === 'Escape') { input.blur(); renderSide(true); } };
      send.onclick = go;
    };
  });
  $('#pcount').textContent = r.plans.length || '';
  $('#plans').innerHTML = r.plans.length ? r.plans.map(planHtml).join('') : '<div class="none">Aucun plan actif.</div>';
  $('#plans').querySelectorAll('[data-plan]').forEach(el => el.onclick = () => { flip(openPlans, el.dataset.plan); saveOpenPlans(); renderSide(true); });
  $('#plans').querySelectorAll('[data-task]').forEach(el => el.onclick = () => { flip(flippedTasks, el.dataset.task); renderSide(true); });
  const nTodos = r.todos.reduce((n, g) => n + g.items.length, 0);
  $('#dcount').textContent = nTodos || '';
  $('#todos').innerHTML = nTodos ? r.todos.map(g => `<div class="grp">${esc(g.label)}</div>` + g.items.map(t => boardItem(t, false)).join('')).join('')
    : `<div class="none">${unreadable ? 'Tableau illisible.' : 'Rien en attente.'}</div>`;
  document.querySelectorAll('aside .ref').forEach(b => b.onclick = () => cite(b.dataset.ref));
  document.querySelectorAll('aside .more').forEach(b => b.onclick = () => { flip(openItems, b.dataset.more); renderSide(true); });
  if (fk) [...document.querySelectorAll('aside [data-fk]')].find(el => el.dataset.fk === fk)?.focus();
}

// ---------- boucle ----------
// Deux sondages ratés de suite (3 s) : la page dit qu'elle n'est plus à jour au lieu d'afficher un état périmé.
const LOST_AFTER = 2;
let fails = 0, lostSince = null, lostStatus = 0;
function setLink(status) {
  if (status === 200) { fails = 0; lostSince = null; }
  else { lostStatus = status; if (++fails >= LOST_AFTER && lostSince === null) lostSince = Date.now() - 1500 * (fails - 1); }
  renderStatus();
}
async function load() {
  let r;
  try { r = await fetch('/api/state'); } catch { setLink(0); return; }
  if (r.status !== 200) { setLink(r.status); return; }
  try { state = await r.json(); } catch { setLink(0); return; }
  setLink(200);
  state.pending = state.pending.filter(c => !answered.has(c.id));
  renderCard(); renderQueue(); renderTalk(); renderSessions(); renderAlerts(); renderHistory(); renderSide();
}
load();
setInterval(load, 1500);
</script>
</body>
</html>
