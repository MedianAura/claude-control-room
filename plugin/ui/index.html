<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>control-room</title>
<link rel="icon" href="data:,">
<style>
  /* Thème et carte forkés de decision-inbox (ui.html). */
  :root {
    --bg: #111214; --panel: #1a1c20; --line: #2a2d33; --text: #e7e7ea; --muted: #9a9ca3;
    --accent: #e0a84f; --accent-bg: #2b2418; --ok: #6cc28b; --ko: #e0645b; --info: #5b8def;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f4f1; --panel: #fff; --line: #e3e1dc; --text: #1c1c1e; --muted: #6b6b70; --accent: #b4741a; --accent-bg: #fbf2e2; --ok: #2f8a52; --ko: #c0453c; --info: #2f63c9; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 22px 20px 60px; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 26px; align-items: start; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  section.left { display: grid; gap: 14px; }
  aside { position: sticky; top: 20px; display: grid; gap: 14px; max-height: calc(100vh - 40px); overflow: auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
  .panel h2 { margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
  /* Titres repliables (colonne de droite) : un vrai bouton, atteignable au clavier. */
  .panel h2 .cap { all: unset; flex: 1; display: flex; justify-content: space-between; cursor: pointer; user-select: none; }
  .panel h2 .cap::before { content: '▾'; width: 1.3em; letter-spacing: 0; }
  .panel.closed h2 .cap::before { content: '▸'; }
  .panel h2 .cap > :first-child { margin-right: auto; }
  .panel.closed .body { display: none; }
  /* Focus clavier : un seul contour, thémé. !important parce que les boutons sont en all: unset, déclaré plus
     bas et souvent plus spécifique : sans lui, le contour disparaît partout. */
  :focus-visible { outline: 2px solid var(--text) !important; outline-offset: 2px !important; }
  textarea:focus-visible, input:focus-visible { outline-offset: 0 !important; border-color: var(--muted); }
  /* Connexion perdue : dit dans l'en-tête du bandeau, voyants éteints, rien ne se décale. */
  #conn { color: var(--ko); text-transform: none; letter-spacing: 0; font-size: 12px; }
  #conn:empty { display: none; }
  #sessionsPanel.lost .row { opacity: .45; }
  .panel .body { margin-top: 8px; }
  code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  .none { color: var(--muted); font-size: 13px; }
  .tdetail { color: var(--muted); }

  /* Bandeau des sessions : une ligne par session, mise à jour sur place. */
  #sessions .row { display: grid; grid-template-columns: 12px minmax(120px, 190px) 1fr 46px; gap: 10px; align-items: center; padding: 4px 6px; border-radius: 6px; font-size: 13.5px; }
  #sessions .row:nth-child(odd) { background: color-mix(in srgb, var(--line) 35%, transparent); }
  #sessions .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  #sessions .st-working .dot { background: var(--accent); } #sessions .st-decision .dot { background: var(--ko); }
  #sessions .st-approval .dot { background: var(--ko); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ko) 30%, transparent); }
  #sessions .st-idle .dot { background: var(--muted); } #sessions .st-done .dot { background: var(--ok); }
  #sessions .lab { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sessions .act { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sessions .at { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }

  /* Bandeaux d'alerte et résumé au retour. */
  .banner { border-radius: 10px; padding: 9px 14px; display: flex; gap: 10px; align-items: baseline; }
  .banner.away { background: color-mix(in srgb, var(--info) 14%, var(--panel)); border: 1px solid color-mix(in srgb, var(--info) 40%, transparent); }
  .banner.alert { background: color-mix(in srgb, var(--ko) 14%, var(--panel)); border: 1px solid var(--ko); }
  #notice:empty { display: none; }
  .banner.notice { background: color-mix(in srgb, var(--accent) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
  .banner .x { all: unset; cursor: pointer; margin-left: auto; color: var(--muted); }

  /* File et carte. */
  .queue { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .queue:empty { display: none; }
  .queue .pill { max-width: 26ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 2px 10px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  .queue .pill.urgent { border-color: var(--accent); }
  .queue .pill.approval { border-color: var(--ko); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; }
  .card.k-approval { border-color: var(--ko); }
  /* Armement (400 / 800 ms) : les choix sont visiblement inertes tant qu'une touche ne peut pas répondre. */
  .card.arming .opts, .card.arming .actions { opacity: .45; }
  .sent { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .sent b { color: var(--text); font-weight: 600; }
  .agent { display: inline-block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); background: var(--accent-bg); padding: 3px 9px; border-radius: 6px; }
  .kind { margin-left: 6px; font-size: 12px; font-weight: 600; color: var(--ko); }
  .summary { font-size: 19px; font-weight: 600; line-height: 1.35; margin: 12px 0 4px; }
  .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 18px 0 6px; }
  .recap ul { margin: 4px 0; padding-left: 20px; }
  pre.cmd { white-space: pre-wrap; word-break: break-all; font: 13px ui-monospace, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 0; }
  .opts { display: grid; gap: 8px; }
  button.opt { all: unset; cursor: pointer; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; padding: 10px 13px; border: 1px solid var(--line); border-radius: 9px; }
  button.opt:hover, button.opt:focus-visible { border-color: var(--muted); }
  button.opt.rec { border-color: var(--accent); background: var(--accent-bg); }
  button.opt.allow { border-color: var(--ok); } button.opt.deny { border-color: var(--ko); }
  .k { font: 12px ui-monospace, monospace; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; text-align: center; padding: 1px 0; height: fit-content; }
  .opt .d { color: var(--muted); font-size: 13.5px; }
  .tag { font-size: 11px; color: var(--accent); font-weight: 600; margin-left: 6px; }
  .prop { border-left: 3px solid var(--accent); padding: 8px 14px; background: var(--accent-bg); border-radius: 0 8px 8px 0; }
  .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .btn { all: unset; cursor: pointer; padding: 8px 15px; border-radius: 8px; font-weight: 600; font-size: 14px; }
  .btn.primary { background: var(--accent); color: #111; }
  .btn.ghost { border: 1px solid var(--line); color: var(--muted); }
  textarea { width: 100%; resize: vertical; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; }
  #note { margin-top: 12px; min-height: 64px; display: none; } #note.show { display: block; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 12px; }
  .empty { text-align: center; color: var(--muted); padding: 56px 20px; border: 1px dashed var(--line); border-radius: 12px; }
  .empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }

  /* Zone de saisie vers l'orchestratrice. */
  .composer { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: end; }
  #msg { min-height: 44px; max-height: 200px; }
  #shot { display: none; font-size: 12px; color: var(--muted); grid-column: 1 / -1; }
  #shot .thumb { position: relative; display: inline-block; margin: 0 8px 6px 0; vertical-align: middle; }
  #shot .thumb img { max-height: 80px; border-radius: 6px; display: block; border: 1px solid var(--line); }
  #shot .thumb .x { all: unset; position: absolute; top: -7px; right: -7px; width: 18px; height: 18px; line-height: 18px; text-align: center;
    font-size: 11px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); color: var(--text); cursor: pointer; }
  #shot .err { color: var(--ko); margin-top: 4px; }
  #histPanel { display: none; } #histPanel.show { display: block; }
  #hist li { margin: 4px 0; font-size: 13px; color: var(--muted); }

  /* Colonne de droite. */
  .grp { font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 2px; }
  .grp:first-child { margin-top: 0; }
  .item { padding: 5px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .grp + .item { border-top: 0; }
  .tb { display: flex; gap: 6px; margin-top: 4px; }
  .tb button { all: unset; cursor: pointer; font-size: 12px; padding: 1px 9px; border: 1px solid var(--line); border-radius: 6px; }
  .tb .okb:hover { border-color: var(--ok); color: var(--ok); } .tb .ko:hover { border-color: var(--ko); color: var(--ko); }
  .tb input { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; font: inherit; font-size: 12px; }
  .bar { height: 4px; background: var(--line); border-radius: 3px; margin: 6px 0 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .phead, .task { all: unset; display: block; width: 100%; box-sizing: border-box; cursor: pointer; user-select: none; }
  .chev { color: var(--muted); display: inline-block; width: 1.1em; }
  .tasks { margin: 4px 0 2px 1.1em; font-size: 12.5px; }
  .task { padding: 2px 0; color: var(--muted); }
  .task.cur { color: var(--text); font-weight: 600; }
  .task.tdone { color: var(--muted); opacity: .75; }
  .steps { margin: 0 0 4px 1.2em; font-size: 12px; color: var(--text); }
  .steps .sdone { color: var(--muted); }
  .pct { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; float: right; }
</style>
</head>
<body>
<main>
  <section class="left">
    <div class="panel" id="sessionsPanel"><h2><span>Sessions</span><span id="conn" role="status"></span><span id="scount"></span></h2><div class="body" id="sessions"></div></div>
    <div id="alerts"></div>
    <div id="away"></div>
    <div class="queue" id="queue"></div>
    <div id="notice"></div>
    <div id="view" aria-live="polite"></div>
    <div class="composer">
      <textarea id="msg" placeholder="Écrire à l'orchestratrice… (Ctrl+Entrée pour envoyer, Ctrl+V pour une capture)"></textarea>
      <button class="btn primary" id="sendMsg">Envoyer</button>
      <button class="btn ghost" id="histBtn" title="Historique">🕘</button>
      <div id="shot"></div>
    </div>
    <div class="panel" id="histPanel"><h2><span>Historique</span></h2><div class="body"><ul id="hist"></ul></div></div>
  </section>
  <aside>
    <div class="panel" data-sec="tests"><h2><button class="cap" aria-expanded="true"><span>À tester par toi</span><span id="tcount"></span></button></h2><div class="body" id="tests"></div></div>
    <div class="panel" data-sec="plans"><h2><button class="cap" aria-expanded="true"><span>Plans actifs</span><span id="pcount"></span></button></h2><div class="body" id="plans"></div></div>
    <div class="panel" data-sec="todos"><h2><button class="cap" aria-expanded="true"><span>TODO</span><span id="dcount"></span></button></h2><div class="body" id="todos"></div></div>
  </aside>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function md(s) {
  const lines = esc(s).split('\n'); let out = '', inList = false;
  for (let l of lines) {
    l = l.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    const m = l.match(/^\s*[-*•]\s+(.*)/);
    if (m) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${m[1]}</li>`; }
    else { if (inList) { out += '</ul>'; inList = false; } out += l ? `<div>${l}</div>` : '<div style="height:6px"></div>'; }
  }
  return out + (inList ? '</ul>' : '');
}
const hhmm = (t) => new Date(t).toLocaleTimeString('fr-CA', { hour: '2-digit', minute: '2-digit' });
// Erreur réseau (serveur arrêté, connexion coupée) : status 0, jamais d'exception silencieuse.
async function post(url, body) {
  let r;
  try { r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }); }
  catch { return { status: 0 }; }
  let json; try { json = await r.json(); } catch {}
  return { status: r.status, json };
}

let state = { pending: [], recent: [], sessions: [], right: { tests: [], plans: [], todos: [] }, events: [], alerts: [] };
let currentId = null, noteOpen = false, pendingChoice = null, lastSent = null;
// Cartes répondues depuis cette page : masquées dès le clic, même si un /api/state parti avant la réponse
// les liste encore. Retirées du Set seulement si l'envoi échoue (la carte revient).
const answered = new Set();
let notice = '';

// ---------- la carte : jamais remplacée tant qu'elle n'a pas de réponse ----------
function optionsOf(c) {
  if (c.kind === 'approval') return [{ id: 'allow', label: 'Autoriser', cls: 'allow' }, { id: 'deny', label: 'Refuser', cls: 'deny' }];
  if (c.kind === 'reply' || c.kind === 'error') return [];
  return c.options || [];
}

function renderCard() {
  const c = currentId && state.pending.find(x => x.id === currentId);
  if (c) return; // la carte affichée reste telle quelle
  const gone = currentId && (state.cancelled || []).find(x => x.id === currentId);
  if (gone) notice = `Carte « ${esc(gone.summary)} » annulée par l'orchestratrice${gone.reason ? ` : ${esc(gone.reason)}` : '.'}`;
  const next = state.pending[0];
  noteOpen = false; pendingChoice = null;
  // Trace de la dernière réponse, posée avec la carte suivante (jamais ajoutée sous une carte en lecture).
  const sent = lastSent ? `<div class="sent">✓ Envoyé à ${esc(lastSent.agent)} : <b>${esc(lastSent.label)}</b> · ${hhmm(lastSent.at)}</div>` : '';
  if (!next) {
    currentId = null;
    $('#view').innerHTML = `${sent}<div class="empty"><b>Rien à trancher</b>Les prochaines cartes de l'orchestratrice apparaîtront ici.</div>`;
    return;
  }
  currentId = next.id;
  shownAt = Date.now();
  const armMs = next.kind === 'approval' ? APPROVAL_ARM_MS : CARD_ARM_MS;
  const opts = optionsOf(next);
  const optHtml = opts.map((o, i) => `
    <button class="opt ${next.recommended === o.id ? 'rec' : ''} ${o.cls || ''}" data-choice="${esc(o.id)}">
      <span class="k">${i + 1}</span>
      <span><span>${esc(o.label)}</span>${next.recommended === o.id ? '<span class="tag">recommandé</span>' : ''}
      ${o.detail ? `<div class="d">${esc(o.detail)}</div>` : ''}</span>
    </button>`).join('');
  const kindTag = next.kind === 'approval' ? '<span class="kind">● approbation</span>' : next.kind === 'error' ? '<span class="kind">● erreur</span>' : next.urgent ? '<span class="kind">● urgent</span>' : '';
  const tool = next.tool ? `<div class="label">Commande</div><pre class="cmd">${esc(next.tool.input && next.tool.input.command ? next.tool.input.command : JSON.stringify(next.tool.input, null, 2))}</pre>` : '';
  const readOnly = next.kind === 'reply' || next.kind === 'error';
  $('#view').innerHTML = `${sent}
    <div class="card k-${esc(next.kind)} arming">
      <span class="agent">${esc(next.agent)}</span>${kindTag}
      <div class="summary">${esc(next.summary)}</div>
      ${tool}
      ${next.recap ? `<div class="label">${readOnly ? 'Message' : 'Résumé'}</div><div class="recap">${md(next.recap)}</div>` : ''}
      ${opts.length ? `<div class="label">Options</div><div class="opts">${optHtml}</div>` : ''}
      ${next.proposition ? `<div class="label">Proposition</div><div class="prop">${md(next.proposition)}</div>` : ''}
      <div class="actions">
        ${readOnly ? `<button class="btn primary" data-choice="read">Lu ↵</button>` : ''}
        ${next.proposition ? `<button class="btn primary" data-choice="proposition">Go avec la proposition ↵</button>` : ''}
        <button class="btn ghost" id="noteBtn">${readOnly ? 'Répondre (N)' : next.kind === 'approval' ? 'Ajouter une note (N)' : 'Autre / nuancer (N)'}</button>
      </div>
      <textarea id="note" placeholder="Ta réponse ou ta nuance… (Ctrl+Entrée pour envoyer)"></textarea>
      <div class="hint">${opts.length ? `1–${opts.length} choisir · ` : ''}${next.proposition || readOnly ? 'Entrée valider · ' : ''}N note · Maj+chiffre = choix + note</div>
    </div>`;
  $('#view').querySelectorAll('[data-choice]').forEach(b => b.onclick = () => answer(b.dataset.choice));
  $('#noteBtn').onclick = toggleNote;
  const card = $('#view .card'), id = next.id;
  setTimeout(() => { if (currentId === id) card.classList.remove('arming'); }, armMs);
}

// Libellé lisible d'une réponse, pour la trace « Envoyé ».
function choiceLabel(c, choice, note) {
  const o = c && optionsOf(c).find(x => x.id === choice);
  const base = o ? o.label : choice === 'proposition' ? 'la proposition' : choice === 'read' ? 'Lu' : choice === 'note' ? 'ta note' : choice;
  return note && choice !== 'note' ? `${base} + note` : base;
}

// Pastilles : ce qui vient après la carte affichée, dans l'ordre de passage. Pas de compteur cumulé.
const QUEUE_PILLS = 5;
function renderQueue() {
  const n = state.pending.length;
  document.title = (lostSince !== null ? '⚠ ' : '') + (n ? `(${n}) control-room` : 'control-room');
  const others = state.pending.filter(c => c.id !== currentId);
  if (!others.length) { $('#queue').innerHTML = ''; return; }
  const pill = c => `<span class="pill ${c.kind === 'approval' ? 'approval' : c.urgent ? 'urgent' : ''}" title="${esc(c.agent)} — ${esc(c.summary)}">${esc(c.summary || c.agent)}</span>`;
  $('#queue').innerHTML = 'Ensuite' + others.slice(0, QUEUE_PILLS).map(pill).join('') +
    (others.length > QUEUE_PILLS ? `<span>+${others.length - QUEUE_PILLS}</span>` : '');
}

let shownNotice = null;
function renderNotice() {
  if (notice === shownNotice) return;
  shownNotice = notice;
  $('#notice').innerHTML = notice ? `<div class="banner notice">${notice}<button class="x" title="Fermer">✕</button></div>` : '';
  const x = $('#notice .x'); if (x) x.onclick = () => { notice = ''; renderNotice(); };
}

function toggleNote() { noteOpen = !noteOpen; const t = $('#note'); t.classList.toggle('show', noteOpen); if (noteOpen) t.focus(); }

async function answer(choice) {
  if (!currentId) return;
  const c = state.pending.find(x => x.id === currentId);
  // Armement : un double clic ou une touche répétée ne doit pas répondre à la carte qui vient d'apparaître.
  if (Date.now() - shownAt < (c && c.kind === 'approval' ? APPROVAL_ARM_MS : CARD_ARM_MS)) return;
  const t = $('#note'); const note = t && t.value.trim();
  if (choice === 'note' && !note) return;
  const id = currentId;
  answered.add(id); notice = '';
  lastSent = { agent: c ? c.agent : '', label: choiceLabel(c, choice, note), at: Date.now() };
  state.pending = state.pending.filter(x => x.id !== id);
  currentId = null; renderCard(); renderQueue(); renderNotice();
  const r = await post('/api/answer', { id, choice, note });
  if (r.status !== 200 && r.status !== 409 && r.status !== 404) {
    answered.delete(id); lastSent = null;
    notice = `Réponse à « ${esc(c ? c.summary : id)} » non envoyée (${r.status ? `erreur ${r.status}` : 'serveur injoignable'}) : la carte revient dans la file.`;
    // Remise locale : si le serveur est tombé, load() échoue aussi et ne la ramènerait pas.
    if (c && !state.pending.some(x => x.id === id)) state.pending.unshift(c);
    renderCard(); renderQueue(); renderNotice();
  }
  load();
}

// Une approbation n'accepte de raccourci qu'après ce délai : une touche répétée ou un double appui sur la carte
// précédente ne doit jamais tomber sur « Autoriser » (revue #10).
const APPROVAL_ARM_MS = 800, CARD_ARM_MS = 400;
let shownAt = 0;

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const c = currentId && state.pending.find(x => x.id === currentId); if (!c) return;
  if (c.kind === 'approval' && Date.now() - shownAt < APPROVAL_ARM_MS && !e.target.closest?.('#note')) return;
  const a = document.activeElement;
  if (a && (a.id === 'msg' || (a.closest && a.closest('aside')))) return;
  if (a && a.id === 'note') {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); answer(pendingChoice || 'note'); }
    if (e.key === 'Escape') toggleNote();
    return;
  }
  // Entrée / Espace sur un bouton focalisé : c'est ce bouton qui répond (activation native), pas la proposition.
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest?.('button')) return;
  const opts = optionsOf(c);
  const m = /^(?:Digit|Numpad)([1-9])$/.exec(e.code || '');
  const digit = m ? +m[1] : NaN;
  if (digit >= 1 && digit <= opts.length) {
    const ch = opts[digit - 1].id;
    if (e.shiftKey) { pendingChoice = ch; if (!noteOpen) toggleNote(); } else answer(ch);
  } else if (e.key === 'Enter' && (c.kind === 'reply' || c.kind === 'error')) answer('read');
  else if (e.key === 'Enter' && c.proposition) answer('proposition');
  else if (e.key.toLowerCase() === 'n') { e.preventDefault(); toggleNote(); }
});

// ---------- bandeau des sessions ----------
const STATE_LABEL = { working: 'travaille', decision: 'attend ta décision', approval: 'attend ton approbation', idle: 'inactive', done: 'terminé' };
function renderSessions() {
  const s = state.sessions || [];
  $('#scount').textContent = s.length || '';
  $('#sessions').innerHTML = s.length ? s.map(x => `
    <div class="row st-${esc(x.status)}"><span class="dot"></span><span class="lab">${esc(x.label)}</span>
      <span class="act">${esc(x.activity || STATE_LABEL[x.status] || '')}</span><span class="at">${x.at ? hhmm(x.at) : ''}</span></div>`).join('')
    : '<div class="none">Aucune session de l\'équipe : l\'orchestratrice et les sessions inscrites (control-room label) apparaissent ici.</div>';
}

function renderAlerts() {
  $('#alerts').innerHTML = (state.alerts || []).map(a => `<div class="banner alert">⚠ ${esc(a)}</div>`).join('');
}

// ---------- résumé au retour ----------
let leftAt = null;
const AWAY_MS = 120000;
function markLeft() { if (leftAt === null) leftAt = Date.now(); }
function markBack() {
  if (leftAt === null) return;
  const away = Date.now() - leftAt; const since = leftAt; leftAt = null;
  if (away < AWAY_MS) return;
  load().then(() => {
    const ev = (state.events || []).filter(e => e.at > since);
    if (!ev.length) return;
    const mins = Math.round(away / 60000);
    const text = ev.map(e => esc(e.text)).join(' · ');
    $('#away').innerHTML = `<div class="banner away"><b>Pendant ton absence (${mins} min) :</b> <span>${text}</span><button class="x" title="Fermer">✕</button></div>`;
    $('#away .x').onclick = () => { $('#away').innerHTML = ''; };
  });
}
document.addEventListener('visibilitychange', () => document.hidden ? markLeft() : markBack());
window.addEventListener('blur', markLeft);
window.addEventListener('focus', markBack);

// ---------- historique ----------
$('#histBtn').onclick = () => $('#histPanel').classList.toggle('show');
function renderHistory() {
  $('#hist').innerHTML = (state.recent || []).map(r => `<li>${r.at ? hhmm(r.at) + ' · ' : ''}${esc(r.text)}</li>`).join('') || '<li>Rien encore.</li>';
}

// ---------- message libre à l'orchestratrice (+ captures collées, 5 au plus) ----------
const MAX_SHOTS = 5, MAX_SHOT_BYTES = 10 * 1024 * 1024;
let shots = [], shotMsg = '';
function renderShots() {
  const el = $('#shot');
  el.style.display = shots.length || shotMsg ? 'block' : 'none';
  el.innerHTML = shots.map((s, i) => !s ? '' : `<span class="thumb"><img src="${s}" alt=""><button class="x" data-i="${i}" title="Retirer">✕</button></span>`).join('')
    + (shots.length ? `<span>${shots.length} capture${shots.length > 1 ? 's' : ''} jointe${shots.length > 1 ? 's' : ''}</span>` : '')
    + (shotMsg ? `<div class="err">${esc(shotMsg)}</div>` : '');
  el.querySelectorAll('.x').forEach(b => b.onclick = () => { shots.splice(+b.dataset.i, 1); shotMsg = ''; renderShots(); });
}
$('#msg').addEventListener('paste', (e) => {
  const files = [...(e.clipboardData?.items || [])].filter(i => i.type.startsWith('image/')).map(i => i.getAsFile());
  if (!files.length) return;
  e.preventDefault();
  for (const file of files) {
    if (shots.length >= MAX_SHOTS) { shotMsg = `${MAX_SHOTS} captures au plus par message.`; break; }
    if (file.size > MAX_SHOT_BYTES) { shotMsg = 'Capture trop lourde (10 Mo max).'; continue; }
    const slot = shots.push(null) - 1; // garde l'ordre de collage malgré la lecture asynchrone
    const reader = new FileReader();
    reader.onload = () => { shots[slot] = reader.result; renderShots(); };
    reader.readAsDataURL(file);
  }
  renderShots();
});
function clearShots() { shots = []; shotMsg = ''; renderShots(); }
async function sendMessage() {
  const text = $('#msg').value.trim();
  const images = shots.filter(Boolean);
  if (!text && !images.length) return;
  const r = await post('/api/message', { text, images });
  if (r.status === 200) { $('#msg').value = ''; clearShots(); load(); return; }
  // Échec : texte et captures restent là pour réessayer.
  shotMsg = r.status === 413 ? ((r.json && r.json.error) || 'Trop lourd.') : r.status === 415 ? 'Ce n\'est pas une image PNG, JPEG ou WebP.'
    : r.status === 0 ? 'control-room ne répond plus (serveur arrêté ?).' : `Envoi impossible (${r.status}).`;
  renderShots();
}
$('#sendMsg').onclick = sendMessage;
$('#msg').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendMessage(); } });

// ---------- colonne de droite ----------
const closed = new Set(JSON.parse(localStorage.getItem('cr-closed') || '[]'));
document.querySelectorAll('aside .panel').forEach(p => {
  const cap = p.querySelector('.cap');
  const sync = () => cap.setAttribute('aria-expanded', String(!p.classList.contains('closed')));
  if (closed.has(p.dataset.sec)) p.classList.add('closed');
  sync();
  cap.onclick = () => { p.classList.toggle('closed'); sync(); closed[p.classList.contains('closed') ? 'add' : 'delete'](p.dataset.sec); localStorage.setItem('cr-closed', JSON.stringify([...closed])); };
});
let lastSide = '', hovering = false;
$('aside').addEventListener('mouseenter', () => { hovering = true; });
$('aside').addEventListener('mouseleave', () => { hovering = false; });

// Plans dépliables : un clic sur le plan montre ses tâches ; la tâche en cours (première non finie) montre ses
// étapes d'office, un clic sur une tâche inverse ce choix.
const openPlans = new Set(JSON.parse(localStorage.getItem('cr-open-plans') || '[]'));
const saveOpenPlans = () => localStorage.setItem('cr-open-plans', JSON.stringify([...openPlans]));
const flippedTasks = new Set();
const inline = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>');
const flip = (set, k) => set.has(k) ? set.delete(k) : set.add(k);
function planHtml(p) {
  const pct = p.total ? Math.round(100 * p.done / p.total) : 0;
  const open = openPlans.has(p.name);
  const head = `<button class="phead" data-plan="${esc(p.name)}" data-fk="plan:${esc(p.name)}" aria-expanded="${open}"><span class="pct">${p.done}/${p.total}</span><span class="chev">${open ? '▾' : '▸'}</span>${esc(p.label || p.name)}</button><div class="bar"><i style="width:${pct}%"></i></div>`;
  if (!open) return `<div class="item">${head}</div>`;
  const tasks = p.tasks || [];
  const cur = tasks.findIndex(t => t.done < t.total);
  const body = tasks.length ? tasks.map((t, i) => {
    const k = `${p.name}::${t.title}`;
    const shown = (i === cur) !== flippedTasks.has(k);
    const mark = t.total && t.done === t.total ? '✓' : i === cur ? '●' : '○';
    const steps = shown && t.steps.length ? `<div class="steps">${t.steps.map(s => `<div class="${s.done ? 'sdone' : ''}">${s.done ? '✓' : '○'} ${inline(s.text)}</div>`).join('')}</div>` : '';
    return `<button class="task ${i === cur ? 'cur' : ''} ${mark === '✓' ? 'tdone' : ''}" data-task="${esc(k)}" data-fk="task:${esc(k)}" aria-expanded="${!!shown}"><span class="pct">${t.done}/${t.total}</span>${mark} ${inline(t.title)}</button>${steps}`;
  }).join('') : '<div class="none">Pas de tâches « ### » dans ce plan.</div>';
  return `<div class="item">${head}<div class="tasks">${body}</div></div>`;
}

function renderSide(force) {
  const r = state.right || { tests: [], plans: [], todos: [] };
  const key = JSON.stringify(r);
  // Gelée sous la souris et pendant une saisie (note KO). Un bouton focalisé ne gèle pas la colonne : il est
  // retrouvé par sa clé data-fk après le rendu, pour qu'on puisse la parcourir au clavier.
  const f = document.activeElement;
  if (!force && (key === lastSide || hovering || f?.matches?.('aside input'))) return;
  const fk = f?.closest?.('aside') && f.dataset.fk;
  lastSide = key;
  const groups = new Map();
  for (const t of r.tests) { if (!groups.has(t.parent)) groups.set(t.parent, []); groups.get(t.parent).push(t); }
  $('#tcount').textContent = r.tests.length || '';
  $('#tests').innerHTML = r.tests.length ? [...groups].map(([g, items]) => `<div class="grp">${esc(g)}</div>` + items.map(t => `
    <div class="item" data-test="${esc(t.text)}"><div>${md(t.text)}${t.detail ? ` <span class="tdetail">${md(t.detail)}</span>` : ''}</div>
      <div class="tb"><button class="okb" data-fk="ok:${esc(t.text)}">OK</button><button class="ko" data-fk="ko:${esc(t.text)}">Problème</button></div></div>`).join('')).join('')
    : '<div class="none">Rien à tester.</div>';
  $('#tests').querySelectorAll('.item').forEach(el => {
    const text = el.dataset.test;
    el.querySelector('.okb').onclick = () => post('/api/test', { text, result: 'ok' }).then(() => { lastSide = ''; load(); });
    el.querySelector('.ko').onclick = () => {
      const tb = el.querySelector('.tb');
      tb.innerHTML = `<input placeholder="Qu'est-ce qui ne marche pas ? (Entrée)"><button class="ko">Envoyer</button>`;
      const input = tb.querySelector('input'); input.focus();
      const go = () => input.value.trim() && post('/api/test', { text, result: 'fail', note: input.value.trim() }).then(() => { input.blur(); lastSide = ''; load(); });
      input.onkeydown = (e) => { if (e.key === 'Enter') go(); if (e.key === 'Escape') { input.blur(); lastSide = ''; renderSide(); } };
      tb.querySelector('button').onclick = go;
    };
  });
  $('#pcount').textContent = r.plans.length || '';
  $('#plans').innerHTML = r.plans.length ? r.plans.map(planHtml).join('') : '<div class="none">Aucun plan actif.</div>';
  $('#plans').querySelectorAll('[data-plan]').forEach(el => el.onclick = () => { flip(openPlans, el.dataset.plan); saveOpenPlans(); renderSide(true); });
  $('#plans').querySelectorAll('[data-task]').forEach(el => el.onclick = () => { flip(flippedTasks, el.dataset.task); renderSide(true); });
  $('#dcount').textContent = r.todos.length || '';
  $('#todos').innerHTML = r.todos.length ? r.todos.map(t => `<div class="item">${esc(t.name)}${t.planDir ? ' <span class="none">· plan</span>' : ''}</div>`).join('')
    : '<div class="none">Rien en attente.</div>';
  if (fk) [...document.querySelectorAll('aside [data-fk]')].find(el => el.dataset.fk === fk)?.focus();
}

// ---------- boucle ----------
// Deux sondages ratés de suite (3 s) : la page dit qu'elle n'est plus à jour au lieu d'afficher un état périmé.
const LOST_AFTER = 2;
let fails = 0, lostSince = null;
function setLink(status) {
  if (status === 200) { fails = 0; lostSince = null; }
  else if (++fails >= LOST_AFTER && lostSince === null) lostSince = Date.now() - 1500 * (fails - 1);
  const lost = lostSince !== null;
  $('#sessionsPanel').classList.toggle('lost', lost);
  $('#conn').textContent = !lost ? ''
    : status === 401 || status === 403 ? 'onglet plus autorisé : utilise celui ouvert par control-room start'
    : `control-room ne répond plus depuis ${hhmm(lostSince)}`;
  const n = state.pending.length;
  document.title = (lost ? '⚠ ' : '') + (n ? `(${n}) control-room` : 'control-room');
}
async function load() {
  let r;
  try { r = await fetch('/api/state'); } catch { setLink(0); return; }
  if (r.status !== 200) { setLink(r.status); return; }
  try { state = await r.json(); } catch { setLink(0); return; }
  setLink(200);
  state.pending = state.pending.filter(c => !answered.has(c.id));
  renderCard(); renderQueue(); renderNotice(); renderSessions(); renderAlerts(); renderHistory(); renderSide();
}
load();
setInterval(load, 1500);
</script>
